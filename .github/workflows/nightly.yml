name: Nightly Full Suite

on:
  schedule:
    - cron: "0 2 * * *"  # 2 AM UTC

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run all tests except weekly
        run: pytest tests/ -m "not tier5" -q --timeout=300
        env:
          PYTHONPATH: .
