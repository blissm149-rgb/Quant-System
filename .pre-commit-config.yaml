repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: Ruff linting
        entry: ruff check quant_fund/ tests/
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: Ruff formatting
        entry: ruff format --check quant_fund/ tests/
        language: system
        types: [python]
        pass_filenames: false

      - id: smoke-tests
        name: Tier 1 smoke tests
        entry: pytest tests/ -m "tier1" -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
